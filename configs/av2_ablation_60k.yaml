dataset: argoverse-2-motion-forecasting
experiment_dir: experiments/av2_ablation_60k

cache:
  train_manifest: data/processed/av2_60k/train-manifest.json
  validation_manifest: data/processed/av2_60k/validation-manifest.json

split_salt: av2-motion-ablation-v1

screen:
  train_targets: 10000
  dev_targets: 2000
  seeds: [17]

final:
  train_targets: 50000
  dev_targets: 10000
  seeds: [17, 29, 43]

training:
  batch_size: 32
  gradient_accumulation: 2
  learning_rate: 0.0003
  weight_decay: 0.0001
  epochs: 8
  warmup_fraction: 0.05
  early_stopping_patience: 3
  gradient_clip: 1.0
  mixed_precision: true
  num_workers: 0
