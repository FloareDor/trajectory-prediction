[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-prediction"
version = "0.1.0"
description = "A local, vectorized motion-forecasting project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "torch>=2.1",
  "matplotlib>=3.6.1",
  "pyarrow>=10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
waymo = [
  "tensorflow==2.12.0",
  "waymo-open-dataset-tf-2-12-0==1.6.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
